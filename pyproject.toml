[project]
name = "agents-orchestrator"
version = "0.1.0"
description = "Local orchestration service driving parallel Cursor SDK agents on isolated worktrees for BI and software-development repos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "drippel" }]

# Runtime dependencies. cursor-sdk is in public beta; we pin minor when 1.0 lands.
dependencies = [
    "cursor-sdk",
    "mcp>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=7.0",
]

[project.scripts]
# Long-running orchestrator daemon. Run this in a terminal to drive the state machine.
agents-orchestrator = "agents_orchestrator.__main__:main"
# stdio MCP server. Cursor spawns this per chat via ~/.cursor/mcp.json.
agents-orchestrator-mcp = "agents_orchestrator.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_orchestrator"]

# Ship the chat skill alongside the package so `agents-orchestrator install-mcp --skill`
# can copy it into ~/.cursor/skills/.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"agents_orchestrator/prompts" = "agents_orchestrator/prompts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
